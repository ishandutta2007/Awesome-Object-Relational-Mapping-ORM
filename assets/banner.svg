<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <style>
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(14px) rotate(-1.5deg); }
      }
      @keyframes pulseLight {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.08); }
      }
      @keyframes circuitFlow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes badgeBob {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }

      .floating-pill-1 {
        animation: floatSlow1 7s ease-in-out infinite;
      }
      .floating-pill-2 {
        animation: floatSlow2 8.5s ease-in-out infinite;
      }
      .ambient-glow-1 {
        animation: pulseLight 6s ease-in-out infinite;
        transform-origin: 250px 180px;
      }
      .ambient-glow-2 {
        animation: pulseLight 7.5s ease-in-out infinite;
        transform-origin: 950px 160px;
      }
      .animated-circuit {
        stroke-dasharray: 20, 10;
        animation: circuitFlow 12s linear infinite;
      }
      .badge-bob {
        animation: badgeBob 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />
  
  <!-- Subtle Grid Backdrop -->
  <rect width="100%" height="100%" fill="url(#grid)" rx="16" />

  <!-- Dynamic Ambient Glow Blobs in Background -->
  <circle class="ambient-glow-1" cx="240" cy="160" r="180" fill="url(#glowCyan)" filter="url(#softGlow)" />
  <circle class="ambient-glow-2" cx="960" cy="170" r="210" fill="url(#glowPurple)" filter="url(#softGlow)" />

  <!-- Animated Data Flow / Circuit Lines Behind Foreground -->
  <g class="animated-circuit" opacity="0.35">
    <path d="M 50 80 Q 200 40 400 90 T 800 60 T 1150 110" fill="none" stroke="#06b6d4" stroke-width="1.5" />
    <path d="M 50 280 Q 300 320 600 270 T 950 310 T 1150 260" fill="none" stroke="#8b5cf6" stroke-width="1.5" />
    <path d="M 120 340 L 260 220 L 380 250" fill="none" stroke="#38bdf8" stroke-width="1" />
    <path d="M 1080 40 L 960 140 L 880 110" fill="none" stroke="#c084fc" stroke-width="1" />
  </g>

  <!-- Background Decorative Floating Pills (Low contrast, non-intrusive) -->
  <g class="floating-pill-1" opacity="0.45">
    <rect x="80" y="45" width="135" height="28" rx="14" fill="#0f172a" stroke="#06b6d4" stroke-width="1" />
    <text x="147" y="63" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Data Mapper</text>
  </g>

  <g class="floating-pill-2" opacity="0.45">
    <rect x="980" y="55" width="145" height="28" rx="14" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" />
    <text x="1052" y="73" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Unit of Work</text>
  </g>

  <g class="floating-pill-2" opacity="0.40">
    <rect x="70" y="285" width="155" height="28" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="147" y="303" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Type-Safe Queries</text>
  </g>

  <g class="floating-pill-1" opacity="0.40">
    <rect x="970" y="275" width="160" height="28" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
    <text x="1050" y="293" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Schema Migrations</text>
  </g>

  <!-- Outer Border -->
  <rect x="2" y="2" width="1196" height="356" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" opacity="0.7" />

  <!-- FOREGROUND: Glassmorphic Backdrop Card for Crisp Readability -->
  <g transform="translate(600, 180)">
    <rect x="-420" y="-120" width="840" height="240" rx="20" fill="#090d16" fill-opacity="0.82" stroke="url(#borderGrad)" stroke-width="1.2" filter="url(#cardGlow)" />
    
    <!-- Top Category Eyebrow Pill -->
    <g transform="translate(0, -78)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" />
      <circle cx="-116" cy="0" r="4" fill="#38bdf8" />
      <text x="8" y="5" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">DATABASE &amp; PERSISTENCE LAYER</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="-20" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5" text-anchor="middle">
      Awesome Object-Relational Mapping
    </text>

    <!-- Subtitle -->
    <text x="0" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">
      Curated Guide to Enterprise ORMs, SQL Query Builders, Cloud DBs &amp; Migration Engines
    </text>

    <!-- Supported Languages / Features Bar in Foreground -->
    <g transform="translate(0, 68)" class="badge-bob">
      <rect x="-350" y="-16" width="700" height="32" rx="16" fill="#111827" fill-opacity="0.95" stroke="#334155" stroke-width="1" />
      
      <text x="-295" y="5" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">TypeScript</text>
      <circle cx="-240" cy="0" r="2.5" fill="#475569" />
      
      <text x="-205" y="5" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Java &amp; JPA</text>
      <circle cx="-140" cy="0" r="2.5" fill="#475569" />
      
      <text x="-105" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Python</text>
      <circle cx="-50" cy="0" r="2.5" fill="#475569" />
      
      <text x="-25" y="5" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Go (Golang)</text>
      <circle cx="48" cy="0" r="2.5" fill="#475569" />
      
      <text x="75" y="5" fill="#fb923c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Rust</text>
      <circle cx="120" cy="0" r="2.5" fill="#475569" />
      
      <text x="145" y="5" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">.NET / C#</text>
      <circle cx="215" cy="0" r="2.5" fill="#475569" />
      
      <text x="245" y="5" fill="#e879f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">PHP &amp; Ruby</text>
    </g>
  </g>
</svg>
